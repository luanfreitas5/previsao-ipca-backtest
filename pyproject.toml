# =============================================================================
# pyproject.toml — fonte única de verdade para dependências e configuração de
# ferramentas. Gerenciador: uv. O uv.lock DEVE ser commitado.
# =============================================================================

[project]
name = "previsao-ipca-backtest"
version = "0.1.0"
description = "Previsão do IPCA mensal com backtest walk-forward sem vazamento temporal, comparada ao Boletim Focus."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Luan Freitas", email = "luan.mgf@gmail.com" }]
keywords = ["ipca", "inflação", "séries temporais", "backtest", "walk-forward", "focus", "bcb"]
classifiers = [ # https://pypi.org/classifiers/
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Natural Language :: Portuguese (Brazilian)",
]

# --- Dependências de runtime (cada uma justificada) --------------------------
dependencies = [
    # Configuração e validação (src/config/, src/schemas/)
    "pydantic>=2.7",             # validação tipada das configurações YAML
    "pydantic-settings>=2.3",    # variáveis de ambiente (.env)
    "python-dotenv>=1.0",        # carregamento do .env
    "pyyaml>=6.0",               # leitura dos YAML em configs/
    "pandera[polars]>=0.20",     # contratos de dados bronze -> silver -> gold

    # Dados
    "polars>=1.0",               # manipulação de dados (preferido sobre pandas)
    "pyarrow>=15.0",             # backend de leitura/escrita Parquet
    "httpx>=0.27",               # cliente HTTP das APIs SGS e Olinda (Focus) do BCB

    # Modelos e estatística
    "numpy>=1.26",               # álgebra numérica, bootstrap e conformal
    "scipy>=1.11",               # distribuição t (teste de Diebold-Mariano)
    "statsforecast>=2.0",        # AutoARIMA e AutoETS
    "pandas>=2.1",               # exigido na interface do statsforecast (conversão pontual)
    "lightgbm>=4.3",             # gradient boosting com lags (API nativa, sem scikit-learn)

    # Rastreamento de experimentos
    "mlflow>=3.0",               # tracking de runs, métricas e artefatos

    # Visualização e terminal
    "matplotlib>=3.8",           # figuras estáticas
    "seaborn>=0.13",             # estilo e gráficos estatísticos
    "rich>=13.0",                # logging, barras de progresso
]

[tool.uv]
# O projeto não é instalado como pacote: `src/` é a raiz de importação (imports
# sem o prefixo `src.`). O pytest resolve por `pythonpath = ["src"]` e o
# `python src/main.py` coloca `src/` em sys.path automaticamente.
package = false
# Os workflows rodam `uv sync --dev`: manter os três grupos como padrão preserva o CI.
# Imagem Docker usa `--no-default-groups` para ficar só com o runtime.
default-groups = ["dev", "quality", "docs"]
required-environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[project.urls]
Homepage = "https://github.com/luanfreitas5/previsao-ipca-backtest"
Documentation = "https://luanfreitas5.github.io/previsao-ipca-backtest/"
Repository = "https://github.com/luanfreitas5/previsao-ipca-backtest"

# --- Grupos de dependências (PEP 735): runtime limpo, ferramentas separadas por finalidade ---
[dependency-groups]
dev = [
    # Lint + format
    "ruff>=0.5",
    # Type checking (roda no CI, não no pre-commit)
    "basedpyright>=1.13",
    # Testes
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    # Workflow
    "pre-commit>=3.7",
    "commitizen>=4.0",
    "detect-secrets>=1.5",
    # Notebooks
    "nbqa>=1.8",
    "nbstripout>=0.7",
    "ipykernel>=6.29",
    "jupyterlab>=4.2",
    # Profiling (sob demanda)
    "scalene>=1.5",
]
quality = [  # checagens pesadas: CI e `make quality`
    "bandit>=1.7",
    "pip-audit>=2.7",
    "vulture>=2.11",
    "refurb>=2.0",
    "xenon>=0.9",
    "radon>=6.0",
    "interrogate>=1.7",
]
docs = [
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
]

# =============================================================================
# RUFF — lint + format (substitui flake8/isort/black)
# =============================================================================
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # flake8-bugbear
    "C4",       # flake8-comprehensions
    "SIM",      # flake8-simplify
    "RET",      # flake8-return
    "ARG",      # flake8-unused-arguments
    "PTH",      # flake8-use-pathlib
    "PD",       # pandas-vet
    "NPY",      # NumPy-specific
    "PERF",     # perflint
    "RUF",      # regras do Ruff
    "PL",       # pylint (subconjunto)
    "TRY",      # tryceratops
]
ignore = [
    "PLR0913", # muitos argumentos — comum em pipelines de ML
    "PLR0917", # muitos parâmetros posicionais
    "PLR2004", # "magic value" em comparação — thresholds de modelo
    "TRY003",  # mensagem longa em exceção
    "PLC0415", # import tardio intencional (statsforecast/lightgbm são pesados)
    "RUF001",  # tipografia pt-BR intencional
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.isort]
# `src/` é a raiz de importação: os pacotes de primeira parte são os diretórios dentro dele.
known-first-party = [
    "backtest",
    "config",
    "data",
    "exceptions",
    "experiment",
    "features",
    "models",
    "pipelines",
    "reporting",
    "schemas",
    "utils",
    "visualization",
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG", "PLR2004", "S101", "PD901"]
"notebooks/*" = ["E402", "F401", "F821", "NPY002"]

[tool.ruff.format]
docstring-code-format = true

# =============================================================================
# BASEDPYRIGHT — type checking estático (roda no CI)
# =============================================================================
[tool.basedpyright]
pythonVersion = "3.10"
typeCheckingMode = "standard"
include = ["src", "tests"]
extraPaths = ["src"]
exclude = ["**/__pycache__", "notebooks", "data", "models", "reports", "logs"]
reportMissingTypeStubs = false
reportMissingImports = "warning"

# =============================================================================
# BANDIT — análise de segurança (roda no CI)
# =============================================================================
[tool.bandit]
exclude_dirs = ["tests", "notebooks", ".venv"]
skips = ["B101"]

# =============================================================================
# VULTURE — detecção de código morto
# =============================================================================
[tool.vulture]
min_confidence = 80
paths = ["src"]
exclude = ["notebooks/"]
ignore_decorators = ["@field_validator", "@model_validator"]
ignore_names = ["cls"]

# =============================================================================
# REFURB — sugestões de modernização
# =============================================================================
[tool.refurb]
ignore = [
    "FURB123",  # float(x) em escalares NumPy: necessário para serialização JSON/MLflow
]

# =============================================================================
# PYTEST — testes (unit, integração, property-based, comportamentais)
# =============================================================================
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "--strict-markers",
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=xml",
]
markers = [
    "smoke: testes rápidos rodados no pre-commit",
    "integration: testes de pipeline ponta a ponta",
    "leakage: testes que verificam ausência de vazamento temporal",
    "slow: testes lentos (excluídos do `make test`)",
]

# =============================================================================
# COVERAGE — meta de cobertura >= 80%
# =============================================================================
[tool.coverage.run]
source = ["src"]
branch = true
omit = [
    "src/main.py",          # orquestração fina da CLI
    "src/pipelines/*",      # cola entre estágios (I/O + rede); a lógica está testada nos módulos
    "*/__init__.py",
]

[tool.coverage.report]
fail_under = 80
show_missing = true

# =============================================================================
# INTERROGATE — cobertura de docstrings
# =============================================================================
[tool.interrogate]
fail-under = 80
ignore-init-method = true
ignore-magic = true
exclude = ["tests", "notebooks", "docs"]

# =============================================================================
# COMMITIZEN — Conventional Commits + SemVer + CHANGELOG
# =============================================================================
[tool.commitizen]
name = "cz_conventional_commits"
version = "0.1.0"
version_files = [
    "pyproject.toml:version",
    "configs/config.yaml:version",
]
tag_format = "v$version"
update_changelog_on_bump = true
major_version_zero = true
