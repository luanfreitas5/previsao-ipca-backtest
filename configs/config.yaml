# Configurações gerais do projeto (validadas por config/settings.py com Pydantic).
version: "0.1.0"
random_seed: 42

data:
  start_date: "2000-01-01"               # início da coleta das séries
  sgs_base_url: "https://api.bcb.gov.br/dados/serie"
  olinda_url: "https://olinda.bcb.gov.br/olinda/servico/Expectativas/versao/v1/odata"
  request_timeout_s: 60
  max_retries: 3
  backoff_s: 2.0
  chunk_years: 5                          # a API SGS limita a janela de séries diárias (10 anos)
  focus_page_size: 10000

focus:
  indicator: "IPCA"
  base_calculo: 0                         # 0 = estatísticas sobre os últimos 30 dias
  publication_lag_days: 3                 # Focus (sexta) é divulgado na segunda seguinte
  max_staleness_days: 10                  # descarta snapshot do Focus mais antigo que isso

backtest:
  first_origin: "2010-01-31"              # primeiro fim de mês usado como origem de previsão
  last_origin: null                       # null = último mês com IPCA divulgado
  horizons: [1, 2, 3, 6, 12]              # meses à frente do mês de origem
  n_lags: 12
  alpha: 0.10                             # intervalos conformais de 90%
  min_calibration: 24                     # mínimo de resíduos para emitir intervalo
  models: [naive_last, naive_seasonal, arima, ets, lightgbm]

report:
  reference_model: "focus"
  n_bootstrap: 1000
  worst_errors_k: 10
  slices:
    - { name: "2010-2015", start: "2010-01-01", end: "2015-12-31" }
    - { name: "2016-2019", start: "2016-01-01", end: "2019-12-31" }
    - { name: "2020-2022 (pandemia e choque)", start: "2020-01-01", end: "2022-12-31" }
    - { name: "2023+", start: "2023-01-01", end: "2100-12-31" }

mlflow:
  experiment_name: "previsao-ipca-backtest"
  tracking_uri: "sqlite:///mlruns/mlflow.db"    # pode ser sobrescrito por MLFLOW_TRACKING_URI
