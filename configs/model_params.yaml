# Hiperparâmetros dos modelos. Sem tuning agressivo: o objetivo é um benchmark
# honesto, não ajustar hiperparâmetros olhando o período de teste.
statsforecast:
  season_length: 12

lightgbm:
  num_boost_round: 200
  learning_rate: 0.05
  num_leaves: 8
  min_data_in_leaf: 10
  feature_fraction: 0.8
  bagging_fraction: 0.8
  bagging_freq: 1
  lambda_l2: 1.0
  min_train_rows: 36          # abaixo disso o modelo não emite previsão
